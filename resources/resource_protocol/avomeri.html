<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta data-i18n-title="title" />
    <link rel="stylesheet" href="resource:///avomeri.css" />
  </head>
  <body>
    <main class="card" role="main">
      <h1 data-i18n="heading"></h1>
      <p class="muted" data-i18n="intro"></p>

      <form id="form" autocomplete="off">
        <label for="q" data-i18n="searchLabel"></label>
        <div class="row">
          <input id="q" name="q" data-i18n-placeholder="searchPlaceholder" />
          <button type="submit" data-i18n="searchButton"></button>
        </div>
      </form>

      <p id="offline" class="offline hidden" aria-live="polite" data-i18n="offline"></p>

      <p id="pullopostiPrompt" class="pulloposti hidden" aria-live="polite" data-i18n-html="pullopostiPrompt"></p>
    </main>

    <script src="resource:///kotisatama-i18n.js"></script>
    <script>
      (function () {
        KotisatamaI18n.applyDocument("avomeri");

        const params = new URLSearchParams(location.search);
        const q = params.get("q") || "";
        const input = document.getElementById("q");
        const form = document.getElementById("form");
        const offlineEl = document.getElementById("offline");
        const pullopostiEl = document.getElementById("pullopostiPrompt");

        input.value = q;

        function setOffline(isOffline) {
          document.documentElement.classList.toggle("is-offline", isOffline);
          offlineEl.classList.toggle("hidden", !isOffline);
          pullopostiEl.classList.toggle("hidden", !isOffline);
          input.disabled = isOffline;
          form.querySelector("button").disabled = isOffline;
        }

        function updateOffline() {
          setOffline(navigator.onLine === false);
        }

        window.addEventListener("online", updateOffline);
        window.addEventListener("offline", updateOffline);
        updateOffline();

        form.addEventListener("submit", function (e) {
          e.preventDefault();
          const query = (input.value || "").trim();
          if (!query) return;
          const url = "https://www.startpage.com/search?q=" + encodeURIComponent(query);
          location.href = url;
        });
      })();
    </script>
  </body>
</html>
