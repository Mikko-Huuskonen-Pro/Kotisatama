<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta data-i18n-title="title" />
    <link rel="stylesheet" href="resource:///config.css">
    <script src="resource:///kotisatama-i18n.js"></script>
    <script src="resource:///config-emoji-icons.js"></script>
</head>
<body>
    <div id="configUnlockOverlay" class="config-unlock-overlay hidden" aria-hidden="true">
        <div class="config-unlock-panel">
            <h2 data-i18n="configUnlockTitle">Asetukset lukittu</h2>
            <p class="profile-hint" data-i18n="configUnlockHint">Syötä kolme emojia avataksesi asetukset.</p>
            <div class="emoji-picker" id="unlockEmojiPicker" aria-label="Emoji-valitsin"></div>
            <input id="unlockEmojiInput" type="hidden" />
            <p class="profile-hint" id="unlockEmojiSelected" aria-live="polite"></p>
            <p id="unlockStatus" class="profile-status" aria-live="polite"></p>
            <button type="button" id="unlockBtn" data-i18n="configUnlockBtn">Avaa</button>
        </div>
    </div>

    <div id="configContent">
        <section class="language-section">
            <h2 data-i18n="languageSection"></h2>
            <label for="languageSelect" data-i18n="languageLabel"></label>
            <select id="languageSelect" onchange="KotisatamaI18n.setLocaleChoice(this.value)">
                <option value="auto" data-i18n="languageAuto"></option>
                <option value="fi" data-i18n="languageFi"></option>
                <option value="sv" data-i18n="languageSv"></option>
            </select>
        </section>
        <section class="language-section" id="profileSection">
            <h2 data-i18n="profileSection">Käyttäjäprofiili</h2>
            <p class="profile-hint" data-i18n="profileHint">Normi on oletus ilman rajoituksia. Hopeakettu ja Lapsi lukitaan kolmella emojilla.</p>
            <fieldset class="profile-choices" id="profileChoices">
                <label><input type="radio" name="profile" value="normi" /> <span data-i18n="profileNormi">Normi</span></label>
                <label><input type="radio" name="profile" value="hopeakettu" /> <span data-i18n="profileHopeakettu">Hopeakettu</span></label>
                <label><input type="radio" name="profile" value="lapsi" /> <span data-i18n="profileLapsi">Lapsi</span></label>
            </fieldset>
            <div id="emojiBlock" class="emoji-block hidden">
                <label for="emojiInput" data-i18n="emojiLabel">Kolme emojia (salasana)</label>
                <p class="profile-hint hidden" id="emojiNormiHint" data-i18n="emojiNormiHint"></p>
                <div class="emoji-picker" id="emojiPicker" aria-label="Emoji-valitsin"></div>
                <input id="emojiInput" type="hidden" />
                <p class="profile-hint" id="emojiSelected" aria-live="polite"></p>
            </div>
            <div id="avomeriBlock" class="avomeri-block hidden">
                <label>
                    <input type="checkbox" id="avomeriToggle" />
                    <span data-i18n="avomeriLabel">Avomeri käytössä</span>
                </label>
            </div>
            <p id="profileStatus" class="profile-status" aria-live="polite"></p>
            <button type="button" id="saveProfileBtn" data-i18n="profileSave">Tallenna profiili</button>
        </section>
        <section class="language-section">
            <h2 data-i18n="licensesSection">Lisenssit</h2>
            <p><a href="servo:license" data-i18n="licensesLink">Avoimen lähdekoodin lisenssit</a></p>
        </section>
        <section class="language-section">
            <h2 data-i18n="mySitesSection"></h2>
            <p><a href="servo:whitelist" data-i18n="mySitesLink"></a></p>
        </section>
    </div>

    <script>
        const kotisatamaLocale = KotisatamaI18n.applyDocument("config");
        const languageSelect = document.getElementById("languageSelect");
        languageSelect.value = KotisatamaI18n.getLocaleChoice();
        for (const option of languageSelect.options) {
            if (option.dataset.i18n) {
                option.textContent = KotisatamaI18n.t(
                    "config",
                    option.dataset.i18n,
                    kotisatamaLocale,
                );
            }
        }

        // KOTISATAMA-PATCH: lukitusoverlay + profiilivalinta + emoji + avomeri — 锁定层+配置文件+表情密码。
        (function initConfigUi() {
            const configContent = document.getElementById("configContent");
            const unlockOverlay = document.getElementById("configUnlockOverlay");
            const unlockStatus = document.getElementById("unlockStatus");
            const unlockInput = document.getElementById("unlockEmojiInput");
            const unlockSelected = document.getElementById("unlockEmojiSelected");
            const emojiInput = document.getElementById("emojiInput");
            const emojiBlock = document.getElementById("emojiBlock");
            const emojiNormiHint = document.getElementById("emojiNormiHint");
            const avomeriBlock = document.getElementById("avomeriBlock");
            const avomeriToggle = document.getElementById("avomeriToggle");
            const statusEl = document.getElementById("profileStatus");
            const emojiSelected = document.getElementById("emojiSelected");

            let savedProfile = "normi";
            let hasEmoji = false;
            let configUnlocked = false;
            let profilePicker = null;
            let unlockPicker = null;

            function selectedProfile() {
                const checked = document.querySelector('input[name="profile"]:checked');
                return checked ? checked.value : "normi";
            }

            function isRestrictedProfile(profile) {
                return profile === "hopeakettu" || profile === "lapsi";
            }

            function switchingToNormiFromRestricted() {
                return (
                    selectedProfile() === "normi" &&
                    isRestrictedProfile(savedProfile) &&
                    hasEmoji
                );
            }

            function needsEmojiForSave() {
                const target = selectedProfile();
                if (isRestrictedProfile(target)) {
                    return true;
                }
                return switchingToNormiFromRestricted();
            }

            function setEmojiInput(chars) {
                emojiInput.value = chars.join("");
                emojiSelected.textContent = chars.join(" ");
            }

            function setUnlockInput(chars) {
                unlockInput.value = chars.join("");
                unlockSelected.textContent = chars.join(" ");
            }

            function showUnlockOverlay(show) {
                unlockOverlay.classList.toggle("hidden", !show);
                unlockOverlay.setAttribute("aria-hidden", show ? "false" : "true");
                configContent.classList.toggle("config-content-locked", show);
            }

            function updateVisibility() {
                const profile = selectedProfile();
                const showEmoji = isRestrictedProfile(profile) || switchingToNormiFromRestricted();
                emojiBlock.classList.toggle("hidden", !showEmoji);
                emojiNormiHint.classList.toggle("hidden", !switchingToNormiFromRestricted());
                avomeriBlock.classList.toggle("hidden", profile !== "hopeakettu");
                if (profile === "normi") {
                    avomeriToggle.checked = true;
                    avomeriToggle.disabled = true;
                } else if (profile === "lapsi") {
                    avomeriToggle.checked = false;
                    avomeriToggle.disabled = true;
                } else {
                    avomeriToggle.disabled = false;
                }
            }

            function maybeShowLock(data) {
                const shouldLock = !!data.restrictions_active && !!data.has_emoji && !configUnlocked;
                showUnlockOverlay(shouldLock);
                if (shouldLock && unlockPicker) {
                    unlockPicker.reset();
                    unlockStatus.textContent = data.locked_out
                        ? KotisatamaI18n.t("config", "profileLocked", kotisatamaLocale)
                        : "";
                }
            }

            profilePicker = KotisatamaEmojiIcons.renderPicker(
                document.getElementById("emojiPicker"),
                {
                    locale: kotisatamaLocale,
                    selectedDisplay: emojiSelected,
                    onChange: setEmojiInput,
                },
            );

            unlockPicker = KotisatamaEmojiIcons.renderPicker(
                document.getElementById("unlockEmojiPicker"),
                {
                    locale: kotisatamaLocale,
                    selectedDisplay: unlockSelected,
                    onChange: setUnlockInput,
                },
            );

            document.querySelectorAll('input[name="profile"]').forEach(function (input) {
                input.addEventListener("change", function () {
                    profilePicker.reset();
                    updateVisibility();
                });
            });

            document.getElementById("unlockBtn").addEventListener("click", function () {
                const chars = Array.from(unlockInput.value || "");
                if (chars.length !== 3) {
                    unlockStatus.textContent = KotisatamaI18n.t(
                        "config",
                        "emojiNeedThree",
                        kotisatamaLocale,
                    );
                    return;
                }
                unlockStatus.textContent = KotisatamaI18n.t("config", "profileSaving", kotisatamaLocale);
                fetch("servo:profile/verify?emoji=" + encodeURIComponent(chars.join("")))
                    .then(function (r) { return r.json(); })
                    .then(function (data) {
                        if (data.status === "ok") {
                            configUnlocked = true;
                            showUnlockOverlay(false);
                            unlockStatus.textContent = "";
                            return loadProfile();
                        }
                        unlockStatus.textContent =
                            data.message ||
                            KotisatamaI18n.t("config", "configUnlockWrong", kotisatamaLocale);
                    })
                    .catch(function () {
                        unlockStatus.textContent = KotisatamaI18n.t(
                            "config",
                            "profileError",
                            kotisatamaLocale,
                        );
                    });
            });

            document.getElementById("saveProfileBtn").addEventListener("click", function () {
                const profile = selectedProfile();
                const chars = Array.from(emojiInput.value || "");
                let url = "servo:profile/set?profile=" + encodeURIComponent(profile);
                if (needsEmojiForSave()) {
                    if (chars.length !== 3) {
                        statusEl.textContent = KotisatamaI18n.t(
                            "config",
                            "emojiNeedThree",
                            kotisatamaLocale,
                        );
                        return;
                    }
                    url += "&emoji=" + encodeURIComponent(chars.join(""));
                }
                if (profile === "hopeakettu") {
                    url += "&avomeri=" + (avomeriToggle.checked ? "1" : "0");
                }
                statusEl.textContent = KotisatamaI18n.t("config", "profileSaving", kotisatamaLocale);
                fetch(url)
                    .then(function (r) { return r.json(); })
                    .then(function (data) {
                        statusEl.textContent = data.message || data.status;
                        if (data.status === "ok") {
                            profilePicker.reset();
                        }
                        return loadProfile();
                    })
                    .catch(function () {
                        statusEl.textContent = KotisatamaI18n.t(
                            "config",
                            "profileError",
                            kotisatamaLocale,
                        );
                    });
            });

            function loadProfile() {
                return fetch("servo:profile/data")
                    .then(function (r) { return r.json(); })
                    .then(function (data) {
                        savedProfile = data.profile || "normi";
                        hasEmoji = !!data.has_emoji;
                        const radio = document.querySelector(
                            'input[name="profile"][value="' + savedProfile + '"]',
                        );
                        if (radio) {
                            radio.checked = true;
                        }
                        avomeriToggle.checked = !!data.avomeri_enabled;
                        if (!isRestrictedProfile(savedProfile)) {
                            configUnlocked = true;
                        }
                        updateVisibility();
                        maybeShowLock(data);
                        if (data.locked_out) {
                            statusEl.textContent = KotisatamaI18n.t(
                                "config",
                                "profileLocked",
                                kotisatamaLocale,
                            );
                        }
                    })
                    .catch(function () {
                        savedProfile = "normi";
                        hasEmoji = false;
                        document.querySelector('input[name="profile"][value="normi"]').checked = true;
                        updateVisibility();
                    });
            }

            loadProfile();
        })();
    </script>
</body>
</html>
