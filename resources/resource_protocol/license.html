<html>

<head>
    <meta charset="UTF-8">
    <meta data-i18n-title="title" />
    <style>
        @media (prefers-color-scheme: dark) {
            body {
                background: #333;
                color: white;
            }
            a {
                color: skyblue;
            }
        }
        .container {
            font-family: sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
        }
        .intro {
            text-align: center;
        }
        #licenseProjects ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
            text-align: left;
        }
        #licenseProjects li {
            margin: 8px 0;
        }
    </style>
</head>

<body>
    <main class="container">
        <div class="intro">
            <h1 data-i18n="title"></h1>
            <p data-i18n-html="intro"></p>
            <p><a href="servo:config">← Takaisin asetuksiin</a></p>
            <div id="licenseProjects"></div>
        </div>

        <script>
        (function () {
          fetch("resource:///licenses.json")
            .then(function (r) { return r.ok ? r.json() : null; })
            .catch(function () { return null; })
            .then(function (data) {
              if (!data || !Array.isArray(data.projects)) return;
              var root = document.getElementById("licenseProjects");
              var groups = {};
              data.projects.forEach(function (p) {
                var g = p.group || "Muut";
                (groups[g] = groups[g] || []).push(p);
              });
              Object.keys(groups).forEach(function (group) {
                var h = document.createElement("h2");
                h.textContent = group;
                root.appendChild(h);
                var ul = document.createElement("ul");
                groups[group].forEach(function (p) {
                  var li = document.createElement("li");
                  var a = document.createElement("a");
                  a.href = p.url || "#";
                  a.textContent = p.name;
                  li.appendChild(a);
                  if (p.description) {
                    li.appendChild(document.createTextNode(" — " + p.description));
                  }
                  if (p.license) {
                    li.appendChild(document.createTextNode(" (" + p.license + ")"));
                  }
                  ul.appendChild(li);
                });
                root.appendChild(ul);
              });
            });
        })();
        </script>
    </main>
    <script src="resource:///kotisatama-i18n.js"></script>
    <script>
      KotisatamaI18n.applyDocument("license");
    </script>
</body>

</html>
