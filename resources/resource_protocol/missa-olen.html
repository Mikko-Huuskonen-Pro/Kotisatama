<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta data-i18n-title="title" />
    <link rel="stylesheet" href="resource:///pulloposti.css" />
  </head>
  <body>
    <main class="card" role="main">
      <h1 data-i18n="heading"></h1>
      <p class="muted" data-i18n="intro"></p>

      <p id="status" class="status" aria-live="polite"></p>
      <p id="address" class="status hidden"></p>

      <div class="actions">
        <button type="button" id="locate" class="button" data-i18n="locateButton"></button>
        <button type="button" id="retry" class="secondary" data-i18n="retry"></button>
        <a class="secondary" href="servo:about" data-i18n="backHome"></a>
      </div>

      <p class="muted small" data-i18n="attribution"></p>
    </main>

    <script src="resource:///kotisatama-i18n.js"></script>
    <script>
      (function () {
        const locale = KotisatamaI18n.applyDocument("missaOlen");
        const statusEl = document.getElementById("status");
        const addressEl = document.getElementById("address");
        const locateEl = document.getElementById("locate");
        const retryEl = document.getElementById("retry");
        const baseUrl = "http://127.0.0.1:7702";

        async function checkHealth() {
          statusEl.textContent = KotisatamaI18n.t("missaOlen", "statusChecking", locale);
          addressEl.classList.add("hidden");
          locateEl.disabled = true;
          try {
            const response = await fetch(baseUrl + "/healthz", { cache: "no-store" });
            if (response.ok) {
              statusEl.textContent = KotisatamaI18n.t("missaOlen", "statusReady", locale);
              locateEl.disabled = false;
              return true;
            }
          } catch (_) {
            /* daemon not running yet */
          }
          statusEl.textContent = KotisatamaI18n.t("missaOlen", "statusError", locale);
          return false;
        }

        async function reverseGeocode(position) {
          const payload = {
            lat: position.coords.latitude,
            lon: position.coords.longitude,
            lang: locale,
          };
          const response = await fetch(baseUrl + "/reverse", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          if (!response.ok) {
            throw new Error("reverse failed");
          }
          return response.json();
        }

        function locate() {
          if (!navigator.geolocation) {
            statusEl.textContent = KotisatamaI18n.t("missaOlen", "geoUnsupported", locale);
            return;
          }
          statusEl.textContent = KotisatamaI18n.t("missaOlen", "locating", locale);
          addressEl.classList.add("hidden");
          navigator.geolocation.getCurrentPosition(
            async (position) => {
              try {
                const result = await reverseGeocode(position);
                addressEl.textContent = result.address;
                addressEl.classList.remove("hidden");
                statusEl.textContent = KotisatamaI18n.t("missaOlen", "located", locale);
              } catch (_) {
                statusEl.textContent = KotisatamaI18n.t("missaOlen", "reverseError", locale);
              }
            },
            () => {
              statusEl.textContent = KotisatamaI18n.t("missaOlen", "geoDenied", locale);
            },
            { enableHighAccuracy: true, timeout: 15000 }
          );
        }

        locateEl.addEventListener("click", locate);
        retryEl.addEventListener("click", checkHealth);
        checkHealth();
      })();
    </script>
  </body>
</html>
