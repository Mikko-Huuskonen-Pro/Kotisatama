<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta data-i18n-title="title" />
    <link rel="stylesheet" href="resource:///pulloposti-app.css" />
  </head>
  <body>
    <main class="page" role="main">
      <header>
        <h1 data-i18n="heading"></h1>
        <p class="muted" data-i18n="intro"></p>
        <p id="status" class="status" aria-live="polite"></p>
      </header>

      <section>
        <h2 data-i18n="lettersHeading"></h2>
        <p id="lettersEmpty" class="muted small hidden" data-i18n="lettersEmpty"></p>
        <ul id="letters" class="letters"></ul>
      </section>

      <section>
        <h2 data-i18n="composeHeading"></h2>
        <form id="composeForm" class="grid">
          <div>
            <label for="toPeer" data-i18n="toPeerLabel"></label>
            <input id="toPeer" name="toPeer" required />
          </div>
          <div>
            <label for="body" data-i18n="bodyLabel"></label>
            <textarea id="body" name="body" required></textarea>
          </div>
          <div class="actions">
            <button type="submit" data-i18n="sendButton"></button>
          </div>
        </form>
      </section>

      <section>
        <h2 data-i18n="pairHeading"></h2>
        <p class="muted small" data-i18n="pairIntro"></p>
        <form id="pairForm" class="grid">
          <div>
            <label for="emojiCode" data-i18n="emojiLabel"></label>
            <input id="emojiCode" name="emojiCode" maxlength="32" required />
          </div>
          <div class="actions">
            <button type="submit" data-i18n="pairButton"></button>
            <button type="button" id="refreshPeers" class="secondary" data-i18n="refreshPeers"></button>
          </div>
        </form>
        <ul id="peers" class="letters"></ul>
      </section>

      <section class="actions">
        <a class="button secondary" href="servo:pulloposti" data-i18n="backGateway"></a>
      </section>
    </main>

    <script src="resource:///kotisatama-i18n.js"></script>
    <script>
      (function () {
        const API_BASE = "http://127.0.0.1:7701";
        const POLL_MS = 5000;
        const locale = KotisatamaI18n.applyDocument("pullopostiApp");
        const statusEl = document.getElementById("status");
        const lettersEl = document.getElementById("letters");
        const lettersEmptyEl = document.getElementById("lettersEmpty");
        const peersEl = document.getElementById("peers");
        const composeForm = document.getElementById("composeForm");
        const pairForm = document.getElementById("pairForm");
        const refreshPeersBtn = document.getElementById("refreshPeers");

        function t(key) {
          return KotisatamaI18n.t("pullopostiApp", key, locale);
        }

        function setStatus(message, isError) {
          statusEl.textContent = message;
          statusEl.style.color = isError ? "#b91c1c" : "";
        }

        async function apiFetch(path, options) {
          const response = await fetch(API_BASE + path, {
            cache: "no-store",
            ...options,
          });
          if (!response.ok) {
            const text = await response.text();
            throw new Error(text || `HTTP ${response.status}`);
          }
          if (response.status === 204) {
            return null;
          }
          const contentType = response.headers.get("content-type") || "";
          if (contentType.includes("application/json")) {
            return response.json();
          }
          return response.text();
        }

        function renderLetters(letters) {
          lettersEl.innerHTML = "";
          if (!letters.length) {
            lettersEmptyEl.classList.remove("hidden");
            return;
          }
          lettersEmptyEl.classList.add("hidden");
          for (const letter of letters) {
            const item = document.createElement("li");
            const meta = document.createElement("div");
            meta.className = "letter-meta";
            const title = document.createElement("div");
            title.textContent = letter.id;
            const preview = document.createElement("div");
            preview.className = "letter-preview small";
            preview.textContent =
              letter.preview ||
              [letter.from_peer_id, letter.to_peer_id].filter(Boolean).join(" → ");
            meta.appendChild(title);
            meta.appendChild(preview);

            const actions = document.createElement("div");
            actions.className = "actions";
            const openBtn = document.createElement("button");
            openBtn.type = "button";
            openBtn.className = "secondary";
            openBtn.textContent = t("openLetter");
            openBtn.addEventListener("click", () => openLetter(letter.id));
            const deleteBtn = document.createElement("button");
            deleteBtn.type = "button";
            deleteBtn.className = "secondary";
            deleteBtn.textContent = t("deleteLetter");
            deleteBtn.addEventListener("click", () => deleteLetter(letter.id));
            actions.appendChild(openBtn);
            actions.appendChild(deleteBtn);

            item.appendChild(meta);
            item.appendChild(actions);
            lettersEl.appendChild(item);
          }
        }

        function renderPeers(peers) {
          peersEl.innerHTML = "";
          for (const peer of peers) {
            const item = document.createElement("li");
            const meta = document.createElement("div");
            meta.className = "letter-meta";
            const title = document.createElement("div");
            title.textContent = peer.name || peer.id;
            const detail = document.createElement("div");
            detail.className = "letter-preview small";
            detail.textContent = peer.paired ? t("peerPaired") : t("peerUnpaired");
            meta.appendChild(title);
            meta.appendChild(detail);
            item.appendChild(meta);
            peersEl.appendChild(item);
          }
        }

        async function refreshLetters() {
          try {
            const data = await apiFetch("/letters");
            const letters = Array.isArray(data) ? data : data.letters || [];
            renderLetters(letters);
            setStatus(t("statusReady"), false);
          } catch (error) {
            setStatus(t("statusError"), true);
          }
        }

        async function refreshPeers() {
          try {
            const data = await apiFetch("/peers");
            const peers = Array.isArray(data) ? data : data.peers || [];
            renderPeers(peers);
          } catch (error) {
            setStatus(t("statusError"), true);
          }
        }

        async function openLetter(id) {
          try {
            const letter = await apiFetch(`/letters/${encodeURIComponent(id)}`);
            window.alert(letter.body || t("letterEmpty"));
          } catch (error) {
            setStatus(t("statusError"), true);
          }
        }

        async function deleteLetter(id) {
          try {
            await apiFetch(`/letters/${encodeURIComponent(id)}`, { method: "DELETE" });
            await refreshLetters();
          } catch (error) {
            setStatus(t("statusError"), true);
          }
        }

        composeForm.addEventListener("submit", async (event) => {
          event.preventDefault();
          const toPeer = document.getElementById("toPeer").value.trim();
          const body = document.getElementById("body").value.trim();
          if (!toPeer || !body) {
            return;
          }
          try {
            await apiFetch("/letters", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ to_peer_id: toPeer, body }),
            });
            composeForm.reset();
            setStatus(t("sendSuccess"), false);
            await refreshLetters();
          } catch (error) {
            setStatus(t("statusError"), true);
          }
        });

        pairForm.addEventListener("submit", async (event) => {
          event.preventDefault();
          const emojiCode = document.getElementById("emojiCode").value.trim();
          if (!emojiCode) {
            return;
          }
          try {
            await apiFetch("/pair", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ emoji_code: emojiCode }),
            });
            setStatus(t("pairStarted"), false);
            await refreshPeers();
          } catch (error) {
            setStatus(t("statusError"), true);
          }
        });

        refreshPeersBtn.addEventListener("click", refreshPeers);
        refreshLetters();
        refreshPeers();
        setInterval(refreshLetters, POLL_MS);
      })();
    </script>
  </body>
</html>
