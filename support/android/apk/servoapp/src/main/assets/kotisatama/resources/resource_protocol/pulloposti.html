<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta data-i18n-title="title" />
    <link rel="stylesheet" href="resource:///pulloposti.css" />
  </head>
  <body>
    <main class="card" role="main">
      <h1 data-i18n="heading"></h1>
      <p class="muted" data-i18n="intro"></p>

      <p id="status" class="status" aria-live="polite"></p>

      <div class="actions">
        <a id="openPulloposti" class="button hidden" href="servo:pulloposti/app" data-i18n="openButton"></a>
        <button type="button" id="retry" class="secondary" data-i18n="retry"></button>
      </div>

      <p class="muted small" data-i18n="footer"></p>
    </main>

    <script src="resource:///kotisatama-i18n.js"></script>
    <script>
      (function () {
        const locale = KotisatamaI18n.applyDocument("pulloposti");
        const statusEl = document.getElementById("status");
        const openEl = document.getElementById("openPulloposti");
        const retryEl = document.getElementById("retry");

        function setOffline(isOffline) {
          document.documentElement.classList.toggle("is-offline", isOffline);
        }

        function updateOffline() {
          setOffline(navigator.onLine === false);
        }

        async function checkHealth() {
          statusEl.textContent = KotisatamaI18n.t("pulloposti", "statusChecking", locale);
          openEl.classList.add("hidden");
          try {
            const response = await fetch("http://127.0.0.1:7701/health", {
              cache: "no-store",
            });
            if (response.ok) {
              statusEl.textContent = KotisatamaI18n.t("pulloposti", "statusReady", locale);
              openEl.classList.remove("hidden");
              return;
            }
          } catch (_) {
            /* daemon not running yet */
          }
          statusEl.textContent = KotisatamaI18n.t("pulloposti", "statusError", locale);
        }

        retryEl.addEventListener("click", checkHealth);
        window.addEventListener("online", updateOffline);
        window.addEventListener("offline", updateOffline);
        updateOffline();
        checkHealth();
      })();
    </script>
  </body>
</html>
